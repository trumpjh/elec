<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 전기기능사 기출문제 풀이</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1>⚡ 전기기능사 기출문제 풀이</h1>
            <p class="subtitle">2025년도 제1회</p>
        </header>

        <!-- 카테고리 선택 -->
        <div class="category-section">
            <label for="categorySelect">단원 선택:</label>
            <select id="categorySelect">
                <option value="all">전체 (모든 문제)</option>
                <option value="전기이론">전기이론</option>
                <option value="전기기기">전기기기</option>
                <option value="전기설비">전기설비</option>
            </select>
        </div>

        <!-- 진행 상황 -->
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text">
                <span id="currentQuestion">1</span> / <span id="totalQuestions">16</span>
            </p>
        </div>

        <!-- 메인 컨텐츠 -->
        <main class="quiz-container">
            <!-- 문제 카드 -->
            <div class="question-card">
                <div class="question-number" id="questionNumber">문제 1</div>
                <div class="question-text" id="questionText">로딩 중...</div>
                
                <!-- 선택지 -->
                <div class="options-section">
                    <div class="options" id="optionsContainer">
                        <!-- JavaScript로 동적 생성 -->
                    </div>
                </div>

                <!-- 채점 결과 -->
                <div class="result-section" id="resultSection" style="display:none;">
                    <div class="result-message" id="resultMessage"></div>
                    <div class="correct-answer" id="correctAnswer"></div>
                </div>
            </div>

            <!-- 버튼 -->
            <div class="button-group">
                <button class="btn btn-submit" id="submitBtn">채점하기</button>
                <button class="btn btn-next" id="nextBtn" style="display:none;">다음 문제</button>
            </div>

            <!-- 완료 메시지 -->
            <div class="completion-section" id="completionSection" style="display:none;">
                <h2>모든 문제를 풀었습니다! 🎉</h2>
                <div class="final-score">
                    <p class="score-text">최종 성적</p>
                    <p class="score-number"><span id="finalScore">0</span> / 16</p>
                    <p class="score-percent"><span id="scorePercent">0</span>%</p>
                </div>
                <button class="btn btn-restart" id="restartBtn">처음부터 시작</button>
            </div>
        </main>

        <!-- 푸터 -->
        <footer class="footer">
            <p>2025년도 제1회 전기기능사 필기시험 기출문제</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
